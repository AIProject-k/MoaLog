name: android-ci

# 모든 push와 PR에서 빌드와 단위 테스트를 돌린다. 실기기·에뮬레이터 테스트(androidTest)는 여기서 돌리지 않는다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # core 모듈이 jvmToolchain(21)을 요구한다. app은 JVM 17로 컴파일하므로 21 하나면 둘 다 된다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Core unit tests (JVM)
        run: ./gradlew :core:test --no-daemon

      - name: App unit tests (JVM)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/tests/
            android/app/build/test-results/
          retention-days: 14
