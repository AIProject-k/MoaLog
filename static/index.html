<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 자동분류</title>
<style>
  :root{
    --bg:#12141a; --panel:#1a1d26; --line:#2a2f3d; --fg:#e8eaf0; --dim:#8b92a8;
    --accent:#6c8cff; --warn:#ffb14e; --danger:#ff6b6b; --ok:#4ec9a5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
         border-bottom:1px solid var(--line);padding:12px 18px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:240px;background:var(--bg);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.1)} button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
  button.danger{background:var(--danger)}
  #drop{margin-top:10px;border:1.5px dashed var(--line);border-radius:10px;
    padding:12px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
  #drop.over{border-color:var(--accent);color:var(--accent);background:#6c8cff14}
  #bar{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
  #bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  #msg{color:var(--dim);font-size:13px;margin-top:6px}
  nav{display:flex;gap:4px;padding:10px 18px 0}
  nav button{background:transparent;color:var(--dim);border-bottom:2px solid transparent;
    border-radius:0;padding:8px 14px}
  nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
  main{padding:16px 18px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .cell{position:relative;background:var(--panel);border-radius:10px;overflow:hidden;
    aspect-ratio:1;cursor:pointer}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;font-size:11px;
    background:linear-gradient(transparent,#000c);color:#fff}
  .cell .cap.guess{color:var(--warn)}
  .chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;
    cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip b{font-weight:400;opacity:.6}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 2px;font-size:15px}
  .card .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  .covers{display:flex;gap:6px}
  .covers img{width:96px;height:96px;object-fit:cover;border-radius:8px;cursor:pointer}
  .dupe{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;
    padding:10px 0;border-bottom:1px solid var(--line)}
  .pick{position:relative;width:104px}
  .pick img{width:104px;height:104px;object-fit:cover;border-radius:8px;display:block}
  .pick label{display:flex;gap:5px;align-items:center;font-size:11px;margin-top:4px;
    color:var(--dim);cursor:pointer}
  .pick.best label{color:var(--ok)}
  .empty{color:var(--dim);padding:30px 0;text-align:center}
  .err{color:var(--danger);padding:14px;border:1px solid var(--danger);border-radius:8px}
  h2{font-size:16px;margin:20px 0 10px}
  h2 span{color:var(--dim);font-weight:400;font-size:13px}
  #modal{position:fixed;inset:0;background:#000d;display:none;z-index:50;
    padding:24px;overflow:auto}
  #modal.on{display:flex;gap:20px;align-items:flex-start;justify-content:center}
  #modal img{max-width:62vw;max-height:88vh;object-fit:contain;border-radius:10px}
  #meta{background:var(--panel);border-radius:12px;padding:16px;min-width:280px;max-width:340px}
  #meta dt{color:var(--dim);font-size:11px;margin-top:9px}
  #meta dd{margin:1px 0 0;font-size:13px;word-break:break-all}
  .tag{display:inline-block;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;margin:3px 3px 0 0;font-size:12px}
  .tag.clip{border-color:var(--accent);color:#a7b9ff}
  .slider{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px;margin:6px 0 14px}
  .slider input{flex:1;max-width:280px}
</style>
</head>
<body>

<header>
  <div class="row">
    <input type="text" id="folder" placeholder="사진 폴더 경로 붙여넣기 (예: C:\Users\me\Pictures)">
    <button id="scanBtn">스캔</button>
  </div>
  <div id="drop">여기로 사진을 끌어다 놓아도 됩니다</div>
  <input type="file" id="picker" multiple accept="image/*" hidden>
  <div id="bar"><i></i></div>
  <div id="msg">대기 중</div>
</header>

<nav>
  <button data-tab="gallery" class="on">갤러리</button>
  <button data-tab="timeline">타임라인</button>
  <button data-tab="cleanup">정리</button>
  <button data-tab="search">검색</button>
</nav>

<main>
  <section id="gallery">
    <div class="row" id="filters" style="margin-bottom:14px"></div>
    <div class="grid" id="gGrid"></div>
  </section>

  <section id="timeline" hidden><div id="tList"></div></section>

  <section id="cleanup" hidden><div id="cBody"></div></section>

  <section id="search" hidden>
    <div class="row">
      <input type="text" id="q" placeholder="예: 접시에 담긴 요리, 눈 내린 겨울 풍경, 종이에 적힌 글씨">
      <button id="sBtn">검색</button>
    </div>
    <div id="sInfo" class="empty">문장으로 찾습니다. CLIP 모델이 있어야 동작합니다.</div>
    <div class="grid" id="sGrid"></div>
  </section>
</main>

<div id="modal"><img id="mImg"><div id="meta"></div></div>

<script>
const $ = s => document.querySelector(s);
const api = (u, o) => fetch(u, o).then(r => r.json());
const post = (u, b) => api(u, {method:'POST', headers:{'Content-Type':'application/json'},
                              body: JSON.stringify(b)});
const kb = n => n > 1048576 ? (n/1048576).toFixed(1)+'MB' : Math.round(n/1024)+'KB';
let activeTags = new Set(), polling = null;

/* ---------- 탭 ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['gallery','timeline','cleanup','search'].forEach(t =>
    $('#'+t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === 'timeline') loadTimeline();
  if (b.dataset.tab === 'cleanup') loadCleanup();
});

/* ---------- 스캔 / 업로드 ---------- */
$('#scanBtn').onclick = async () => {
  const folder = $('#folder').value.trim();
  if (!folder) return;
  const r = await post('/api/scan', {folder});
  if (r.error) { $('#msg').textContent = r.error; return; }
  $('#msg').textContent = `${r.found.toLocaleString()}장 발견 — 처리 시작`;
  startPoll();
};
$('#drop').onclick = () => $('#picker').click();
$('#picker').onchange = e => upload(e.target.files);
['dragover','dragleave','drop'].forEach(ev => $('#drop').addEventListener(ev, e => {
  e.preventDefault();
  $('#drop').classList.toggle('over', ev === 'dragover');
  if (ev === 'drop') upload(e.dataTransfer.files);
}));
async function upload(files){
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append('files', f));
  $('#msg').textContent = `${files.length}장 업로드 중…`;
  await fetch('/api/upload', {method:'POST', body: fd});
  startPoll();
}

/* ---------- 진행 상황 ---------- */
function startPoll(){ if (!polling) polling = setInterval(poll, 1200); poll(); }
async function poll(){
  const s = await api('/api/status');
  $('#msg').textContent = s.msg;
  $('#bar>i').style.width = s.total ? (100*s.done/s.total)+'%' : '0';
  if (!s.running) {
    clearInterval(polling); polling = null;
    loadTags(); loadGallery();
    if (!$('#timeline').hidden) loadTimeline();
    if (!$('#cleanup').hidden) loadCleanup();
  }
}

/* ---------- 갤러리 ---------- */
async function loadTags(){
  const tags = await api('/api/tags');
  $('#filters').innerHTML = '';
  tags.forEach(t => {
    const c = document.createElement('span');
    c.className = 'chip' + (activeTags.has(t.label) ? ' on' : '');
    c.innerHTML = `${t.label} <b>${t.n}</b>`;
    c.onclick = () => {
      activeTags.has(t.label) ? activeTags.delete(t.label) : activeTags.add(t.label);
      loadTags(); loadGallery();
    };
    $('#filters').append(c);
  });
  if (!tags.length) $('#filters').innerHTML =
    '<span style="color:var(--dim)">아직 태그가 없습니다. 폴더를 스캔하세요.</span>';
}
function cells(list, target){
  target.innerHTML = '';
  if (!list.length) { target.innerHTML = '<div class="empty">결과 없음</div>'; return; }
  list.forEach(p => {
    const d = document.createElement('div');
    d.className = 'cell';
    d.innerHTML = `<img loading="lazy" src="/thumb/${p.id}">
      <div class="cap${p.exact_date ? '' : ' guess'}">${p.when}${
        p.score !== undefined ? ' · ' + p.score : ''}</div>`;
    d.onclick = () => openModal(p.id);
    target.append(d);
  });
}
async function loadGallery(){
  cells(await api('/api/photos?limit=300&tags=' + [...activeTags].join(',')), $('#gGrid'));
}

/* ---------- 타임라인 ---------- */
async function loadTimeline(){
  const evs = await api('/api/timeline');
  $('#tList').innerHTML = evs.length ? '' :
    '<div class="empty">타임라인이 비어 있습니다. 촬영 시각이 있는 사진이 필요합니다.</div>';
  evs.forEach(e => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<h3>${e.title}</h3>
      <div class="sub">${e.span} · ${e.count}장${
        e.place ? ' · ' + e.place : (e.gps ? ' · 📍 ' + e.gps : '')}</div>
      <div class="covers">${e.covers.map(i =>
        `<img src="/thumb/${i}" data-id="${i}">`).join('')}</div>`;
    c.querySelectorAll('img').forEach(im => im.onclick = () => openModal(+im.dataset.id));
    $('#tList').append(c);
  });
}

/* ---------- 정리 ---------- */
async function loadCleanup(){
  const c = await api('/api/cleanup');
  const box = $('#cBody');
  const sel = new Set();
  box.innerHTML = `
    <div class="row" style="margin-bottom:6px">
      <button class="danger" id="trashBtn" disabled>선택 항목 휴지통으로</button>
      <span id="selInfo" style="color:var(--dim)"></span>
    </div>
    <div class="slider">흐림 임계값
      <input type="range" id="blurT" min="0" step="1"
             max="${Math.max(20, Math.round((c.dist.p50 ?? 200) * 1.5))}"
             value="${c.thresholds.blur_threshold}">
      <b id="blurV">${c.thresholds.blur_threshold}</b>
      <span>— 이 값보다 선명도가 낮으면 흐림. 0이면 제안 안 함</span>
    </div>
    ${c.dist.p50 === undefined ? '' : `<div class="slider" style="margin-top:-8px">
      내 사진 선명도 분포 —
      ${['p1','p5','p10','p25','p50','p90'].map(k =>
        `<span class="tag">하위 ${k.slice(1)}% ${c.dist[k]}</span>`).join('')}
      <span style="flex:1">기기·피사체마다 달라서 기본값을 정할 수 없습니다. 분포를 보고 정하세요.</span>
    </div>`}`;

  const upd = () => {
    $('#trashBtn').disabled = !sel.size;
    $('#selInfo').textContent = sel.size ? `${sel.size}장 선택됨` : '';
  };
  const pick = (id, name, checked, best) => {
    const d = document.createElement('div');
    d.className = 'pick' + (best ? ' best' : '');
    d.innerHTML = `<img src="/thumb/${id}" title="${name}">
      <label><input type="checkbox" ${checked ? 'checked' : ''}>${best ? '남길 것' : '지움'}</label>`;
    const cb = d.querySelector('input');
    if (checked) sel.add(id);
    cb.onchange = () => { cb.checked ? sel.add(id) : sel.delete(id); upd(); };
    d.querySelector('img').onclick = () => openModal(id);
    return d;
  };

  const sec = (title, note) => {
    const h = document.createElement('h2');
    h.innerHTML = `${title} <span>${note}</span>`;
    box.append(h);
  };

  sec(`중복 ${c.dupes.length}그룹`, `되찾는 용량 ${kb(c.dupe_bytes)}`);
  if (!c.dupes.length) box.insertAdjacentHTML('beforeend', '<div class="empty">중복 없음</div>');
  c.dupes.forEach(g => {
    const row = document.createElement('div');
    row.className = 'dupe';
    row.insertAdjacentHTML('beforeend',
      `<div style="width:64px;color:var(--dim);font-size:12px">${
        g.kind === 'exact' ? '완전<br>동일' : '연사'}</div>`);
    g.items.forEach(i => row.append(pick(i.id, i.name, !i.best, i.best)));
    box.append(row);
  });

  sec(`흐린 사진 ${c.blurry.length}장`, '슬라이더로 기준을 조절하세요');
  const bg = document.createElement('div'); bg.className = 'dupe';
  c.blurry.forEach(i => bg.append(pick(i.id, `${i.name} (선명도 ${i.score})`, false, false)));
  box.append(c.blurry.length ? bg : Object.assign(document.createElement('div'),
    {className:'empty', textContent:'흐린 사진 없음'}));

  sec(`저품질 ${c.lowq.length}장`, '너무 어둡거나 밝거나 작은 사진');
  const lg = document.createElement('div'); lg.className = 'dupe';
  c.lowq.forEach(i => lg.append(pick(i.id, `${i.name} (밝기 ${i.score})`, false, false)));
  box.append(c.lowq.length ? lg : Object.assign(document.createElement('div'),
    {className:'empty', textContent:'저품질 없음'}));

  $('#blurT').oninput = e => $('#blurV').textContent = e.target.value;
  $('#blurT').onchange = async e => {
    await post('/api/config', {blur_threshold: +e.target.value});
    loadCleanup();
  };
  $('#trashBtn').onclick = async () => {
    if (!confirm(`${sel.size}장을 휴지통으로 보냅니다. 계속할까요?`)) return;
    const r = await post('/api/trash', {ids: [...sel]});
    alert(`휴지통으로 ${r.moved}장 이동`
      + (r.failed.length ? `\n실패 ${r.failed.length}장` : '')
      + (r.kept.length ? `\n중복 그룹당 1장은 남겼습니다 (${r.kept.length}장)` : ''));
    loadCleanup(); loadTags(); loadGallery();
  };
  upd();
}

/* ---------- 검색 ---------- */
$('#sBtn').onclick = doSearch;
// isComposing 검사가 없으면 한글 조합을 확정하는 Enter가 검색까지 실행해서
// 아직 완성되지 않은 글자로 검색이 나간다.
$('#q').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) doSearch(); };
async function doSearch(){
  const q = $('#q').value.trim();
  if (!q) return;
  $('#sInfo').textContent = '검색 중…';
  const r = await post('/api/search', {q});
  if (r.error) { $('#sInfo').className = 'err'; $('#sInfo').textContent = r.error;
                 $('#sGrid').innerHTML = ''; return; }
  $('#sInfo').className = r.warning ? 'err' : 'empty';
  $('#sInfo').textContent = r.warning
    || (r.query === q ? `"${q}" · 유사도 순 ${r.results.length}장`
                      : `"${q}" → "${r.query}" · 유사도 순 ${r.results.length}장`);
  cells(r.results, $('#sGrid'));
}

/* ---------- 상세 ---------- */
async function openModal(id){
  const d = await api('/api/detail/' + id);
  $('#mImg').src = '/photo/' + id;
  $('#meta').innerHTML = `
    <dl>
      <dt>촬영</dt><dd>${d.when} <span style="color:var(--dim)">(${
        d.when_src === 'exif' ? 'EXIF' : '파일 수정시각 추정'})</span></dd>
      <dt>크기</dt><dd>${d.wh} · ${kb(d.bytes)}</dd>
      <dt>카메라</dt><dd>${d.camera || '—'}</dd>
      <dt>위치</dt><dd>${d.gps || '—'}</dd>
      <dt>선명도 / 밝기</dt><dd>${d.blur} / ${d.bright}</dd>
      <dt>태그</dt><dd>${d.tags.map(t =>
        `<span class="tag ${t.source}">${t.label}${
          t.score != null ? ' ' + t.score.toFixed(2) : ''}</span>`).join('') || '—'}</dd>
      <dt>경로</dt><dd style="color:var(--dim);font-size:11px">${d.path}</dd>
    </dl>`;
  $('#modal').classList.add('on');
}
$('#modal').onclick = e => { if (e.target.id !== 'mImg') $('#modal').classList.remove('on'); };
document.onkeydown = e => { if (e.key === 'Escape') $('#modal').classList.remove('on'); };

/* ---------- 시작 ---------- */
loadTags(); loadGallery(); poll();
</script>
</body>
</html>
